name: coda-autorl

channels:
  - conda-forge

dependencies:
  - python=3.11.15
  - pip
  - pip:
      # Numerical / analysis stack
      - numpy==2.4.4
      - pandas==3.0.2
      - scipy==1.17.1
      - scikit-learn==1.8.0
      - statsmodels>=0.14.4,<0.15
      - matplotlib>=3.8,<4

      # Training stack recorded in the archived experiment metadata
      - ray[rllib,tune]==2.55.1
      - gymnasium==1.2.2
      - mujoco==3.8.0

      # The original runs used PyTorch 2.5.1+cu121.
      # The CUDA 12.1 wheel is available from the PyTorch package index.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
